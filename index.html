<!DOCTYPE html>
<html>
    <head> 
        <title>
            A-Frame scene
        </title> 
        <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> 
        </script>
    </head>
    <body> 
        <a-scene>
            <a-box
            color="red"   
            position="0 0 -8"
            width="4"
            height="4"
            depth="4">
            </a-box>

            <a-sphere
            color="chocolate"
            position="0 3.5 -8"
            radius="1.5">
            </a-sphere>
            
            <a-cylinder
            color="saddlebrown"
            position="0 5.2 -8"
            rotation="0 30 0"
            radius="0.2"
            height="0.6">
            </a-cylinder>     
            
            <a-plane
            color="forestgreen"
            position="0 -2 -8"
            rotation="-90 0 0"
            width="10"
            height="10">
            </a-plane>

            <a-cone
            color="darkorange"
            position="0 3 -6.5"
            rotation="0 0 0"
            radius-bottom="0.2"
            height="0.4">                
            </a-cone>

             <a-cone
            color="darkorange"
            position="0.5 4 -6.6"
            rotation="0 0 0"
            radius-bottom="0.2"
            height="0.4">                
            </a-cone>

             <a-cone
            color="darkorange"
            position="-0.5 4 -6.6"
            rotation="0 0 0"
            radius-bottom="0.2"
            height="0.4">                
            </a-cone>

        </a-scene>
    </body>
</html>
